<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F10.2 — Evidence flows to authority</title><desc id="desc">Authority map routing FDE and engineering evidence to domain, security, privacy, operations, accessibility, legal, and business owners, with missing evidence returning and absent authority blocking exposure. Reading order: FDE + engineering: Implement · verify · recommend; Domain owner: Workflow and safety decision; Security / privacy: Control and data decision; Operations / accessibility: Operability and task access; Legal / business: Obligation and outcome decision; Stop path: Required evidence or authority absent.</desc>
