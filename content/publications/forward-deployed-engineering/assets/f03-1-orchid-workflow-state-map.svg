  <title id="title">F03.1 — Orchid current workflow and state</title><desc id="desc">Swimlane-style workflow from service request through dispatch, equipment identification, evidence, inspection, approval, inventory, resolution, record update, escalation, and reopen. Reading order: Request: Incoming symptom: Ticket created; Dispatch: Queue · wait: Technician assigned; Identify: Equipment match?: Personal notes; Evidence: Manual · site inspection: Missing or stale; Approve: Qualified safety decision: Escalate when absent; Resolve: Inventory · action: Update or reconcile; Close / reopen: Outcome evidence: Return on contradiction.</desc>
