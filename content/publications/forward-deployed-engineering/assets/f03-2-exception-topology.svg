  <title id="title">F03.2 — Exceptions define the real workflow</title><desc id="desc">Exception topology around the Orchid normal path, including identifier mismatch, missing manual, stale inventory, low connectivity, approval, API timeout, accessibility, support, cancellation, and reopen. Reading order: Data: Identifier mismatch: Missing manual; Dependency: Stale inventory: Timeout after write; Environment: Low connectivity: Inaccessible interface; Authority: Policy · approval: Safety escalation; Operations: Support gap: Cancellation · reopen.</desc>
