<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F09.1 — Use the least uncertain mechanism</title><desc id="desc">Mechanism ladder from deterministic rule through retrieval, model suggestion, constrained action, and bounded agent, with Orchid stopping at evidence retrieval plus suggestion and qualified approval. Reading order: Rule: Deterministic; Retrieval: Bounded evidence; Suggestion: Model output · no authority; Constrained action: Policy + approval; Bounded agent: Tools · state · recovery.</desc>
  <defs><style>text{font-family:&quot;Hanken Grotesk&quot;,&quot;Helvetica Neue&quot;,sans-serif}.mono{font-family:monospace}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2C4A6E"/></marker></defs>
  <rect width="1200" height="760" fill="#FFFFFF"/><path d="M0 132 H1200 M0 690 H1200" stroke="#D1D1D1"/>
  <text x="60" y="58" class="mono" font-size="13" letter-spacing="2" fill="#2C4A6E">F09.1 · FORWARD DEPLOYED ENGINEERING</text>
  <text x="60" y="103" text-anchor="start" font-size="30" font-weight="700" fill="#121212" class=""><tspan x="60" dy="0">Use the least uncertain mechanism</tspan></text>
