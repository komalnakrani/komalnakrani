  <title id="title">F04.1 — Outcome evidence needs guardrails</title><desc id="desc">Metric tree with safe resolution outcome above workflow, adoption, system quality, and guardrail branches, plus gaming paths where closure improves while safe resolution worsens. Reading order: Contracted outcome: Safe resolution for the defined population; Leading workflow: Evidence found · decision time; Adoption: Representative task completion; System quality: Latency · failure · reconciliation; Guardrails: Unsafe exclusion · transfer · premature close.</desc>
