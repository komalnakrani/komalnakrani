    <text x="450" y="449" text-anchor="start" font-size="19" font-weight="700" fill="#121212" class=""><tspan x="450" dy="0">Escalate</tspan></text>
    <text x="450" y="499" font-size="17" font-weight="450" fill="#454545"><tspan x="450" dy="0">• Missing evidence or authority blocks</tspan><tspan x="450" dy="20">exposure</tspan></text>
  </g></g>
