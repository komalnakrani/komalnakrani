<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F06.2 — Failure must end with ownership</title><desc id="desc">Failure and ownership matrix connecting Orchid failures to propagation, detection, containment or fallback, correction or reconciliation, and accountable owner, including configured versus operational state. Reading order: Failure: Identity · dependency · data: Configured ≠ operational; Propagation: User and workflow effect; Detection: Signal · evidence · blind spot; Containment: Fallback · isolate · stop; Correction: Reconcile · verify · restore; Owner: Named action and authority.</desc>
