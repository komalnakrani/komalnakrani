  <title id="title">F07.2 — A contract is more than a schema</title><desc id="desc">Data-contract anatomy for Orchid equipment evidence, contrasting a valid but ambiguous schema with semantic meaning, proposition owner, provenance, quality rule, version, sensitivity, and invalid or conflicting behavior. Reading order: Shape: Field · type · required; Meaning: Means / does not mean: Proposition owner; Evidence: Provenance · freshness: Quality rule; Change: Version · compatibility: Migration; Failure: Missing · invalid · conflict: Exception owner.</desc>
