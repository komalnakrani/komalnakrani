<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F02.2 — Evidence ladder with retained limits</title><desc id="desc">Five-step evidence ladder from reported to observed, measured, reproduced, and production evidence, with source, context, sample, confidence, contradiction, and limitation retained at every rung. Reading order: Reported: Stakeholder statement; Observed: Work seen in context; Measured: Defined population and window; Reproduced: Repeatable condition; Production: Representative live evidence.</desc>
  <defs><style>text{font-family:&quot;Hanken Grotesk&quot;,&quot;Helvetica Neue&quot;,sans-serif}.mono{font-family:monospace}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2C4A6E"/></marker></defs>
  <rect width="1200" height="760" fill="#FFFFFF"/><path d="M0 132 H1200 M0 690 H1200" stroke="#D1D1D1"/>
  <text x="60" y="58" class="mono" font-size="13" letter-spacing="2" fill="#2C4A6E">F02.2 · FORWARD DEPLOYED ENGINEERING</text>
  <text x="60" y="103" text-anchor="start" font-size="30" font-weight="700" fill="#121212" class=""><tspan x="60" dy="0">Evidence ladder with retained limits</tspan></text>
  <g><g><rect x="110" y="190" width="620" height="64" rx="7" fill="#FFFFFF" stroke="#2C4A6E" stroke-width="2"/><text x="132" y="217" font-size="18" font-weight="700" fill="#121212">Reported</text><text x="132" y="239" font-size="14" fill="#454545">Stakeholder statement</text><path d="M 738 222 L 782 222" fill="none" stroke="#2C4A6E" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/></g><g><rect x="184" y="266" width="595" height="64" rx="7" fill="#FFFFFF" stroke="#2C4A6E" stroke-width="2"/><text x="206" y="293" font-size="18" font-weight="700" fill="#121212">Observed</text><text x="206" y="315" font-size="14" fill="#454545">Work seen in context</text><path d="M 787 298 L 856 298" fill="none" stroke="#2C4A6E" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/></g><g><rect x="258" y="342" width="570" height="64" rx="7" fill="#FFFFFF" stroke="#2C4A6E" stroke-width="2"/><text x="280" y="369" font-size="18" font-weight="700" fill="#121212">Measured</text><text x="280" y="391" font-size="14" fill="#454545">Defined population and window</text><path d="M 836 374 L 930 374" fill="none" stroke="#2C4A6E" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/></g><g><rect x="332" y="418" width="545" height="64" rx="7" fill="#FFFFFF" stroke="#2C4A6E" stroke-width="2"/><text x="354" y="445" font-size="18" font-weight="700" fill="#121212">Reproduced</text><text x="354" y="467" font-size="14" fill="#454545">Repeatable condition</text><path d="M 885 450 L 1004 450" fill="none" stroke="#2C4A6E" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/></g><g><rect x="406" y="494" width="520" height="64" rx="7" fill="#2C4A6E" stroke="#2C4A6E" stroke-width="2"/><text x="428" y="521" font-size="18" font-weight="700" fill="#FFFFFF">Production</text><text x="428" y="543" font-size="14" fill="#FFFFFF">Representative live evidence</text></g></g>
  <g class="mono" font-size="12" fill="#767676"><line x1="60" y1="721" x2="92" y2="721" stroke="#454545" stroke-width="3"/><text x="104" y="725">observed / required</text><line x1="290" y1="721" x2="322" y2="721" stroke="#767676" stroke-width="2" stroke-dasharray="7 6"/><text x="334" y="725">boundary / proposed</text><path d="M555 708 l13 13 -13 13 -13 -13 z" fill="#E7ECF2" stroke="#2C4A6E"/><text x="580" y="725">decision</text><text x="1140" y="725" text-anchor="end">ORCHID · FICTIONAL / SYNTHETIC</text></g>
