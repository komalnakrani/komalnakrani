<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F07.1 — Intent survives partial failure</title><desc id="desc">Sequence from ticket and equipment confirmation through manual and inventory reads, showing correlation, timeout, retry decision, idempotent intent, unknown state, status lookup, and reconciliation. Reading order: Confirm: Ticket + equipment: Correlation ID; Read evidence: Manual + inventory: Freshness bound; Create intent: Idempotency key: Pending state; Timeout: Do not guess success: Expose unknown; Status lookup: Completed · absent · conflict; Reconcile: One visible result: Owner on conflict.</desc>
