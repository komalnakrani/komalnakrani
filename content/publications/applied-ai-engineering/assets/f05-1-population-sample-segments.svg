<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Population, sample, label, and segment composition</title><desc id="d">Nested population and sample areas are crossed by segments, with unknown and excluded groups outside the evidence.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="60" y="70" font-family="system-ui" font-size="38" font-weight="700">Representative is always relative to a claim</text><rect x="70" y="120" width="1060" height="530" rx="30" fill="#e9e1d4" stroke="#171717" stroke-width="3"/><text x="105" y="170" font-family="system-ui" font-size="24" font-weight="700">INTENDED TASK POPULATION</text><rect x="225" y="205" width="750" height="365" rx="28" fill="#d7dbef" stroke="#343d78" stroke-width="3"/><text x="265" y="255" font-family="system-ui" font-size="24" font-weight="700">OBSERVED / CONSTRUCTED SAMPLE</text><rect x="385" y="300" width="430" height="180" rx="22" fill="#fff" stroke="#343d78" stroke-width="3"/><text x="600" y="360" text-anchor="middle" font-family="system-ui" font-size="23" font-weight="700">LABEL PROCESS</text><text x="600" y="400" text-anchor="middle" font-family="system-ui" font-size="19">criteria + evidence + reviewer + uncertainty</text><g fill="none" stroke="#8b2f2f" stroke-width="4" stroke-dasharray="12 9"><ellipse cx="420" cy="390" rx="250" ry="155"/><ellipse cx="770" cy="390" rx="250" ry="155"/></g><text x="250" y="530" font-family="system-ui" font-size="18" fill="#8b2f2f">SEGMENT A</text><text x="835" y="530" font-family="system-ui" font-size="18" fill="#8b2f2f">SEGMENT B</text><text x="845" y="625" font-family="system-ui" font-size="18">UNKNOWN / EXCLUDED REMAINS VISIBLE</text><text x="60" y="715" fill="#545454" font-family="system-ui" font-size="19">F05.1  Sample membership does not transfer population coverage or label validity.</text></svg>
