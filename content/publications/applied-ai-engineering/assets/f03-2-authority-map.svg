<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Authority map</title><desc id="d">An evidence flow separates suggestion, correction, specialist review, domain decision, formal authorization, and execution.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="70" y="75" font-family="system-ui" font-size="38" font-weight="700">Review is not authority</text><g font-family="system-ui"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="70" y="145" width="300" height="95" rx="18"/><rect x="450" y="145" width="300" height="95" rx="18"/><rect x="830" y="145" width="300" height="95" rx="18"/><rect x="70" y="375" width="300" height="95" rx="18"/><rect x="450" y="375" width="300" height="95" rx="18"/><rect x="830" y="375" width="300" height="95" rx="18"/></g><g font-size="21" font-weight="700" text-anchor="middle"><text x="220" y="202">SYSTEM SUGGESTION</text><text x="600" y="202">USER CORRECTION</text><text x="980" y="202">SPECIALIST REVIEW</text><text x="220" y="432">DOMAIN DECISION</text><text x="600" y="420">FORMAL</text><text x="600" y="447">AUTHORIZATION</text><text x="980" y="432">EXECUTION</text></g><path d="M370 192H450M750 192H830M980 240V315H220V375M370 422H450M750 422H830" fill="none" stroke="#171717" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#171717"/></marker></defs><rect x="210" y="565" width="780" height="70" rx="35" fill="#343d78"/><text x="600" y="609" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Name competence, evidence, timing, reversibility, and decision right.</text></g><text x="70" y="720" fill="#545454" font-family="system-ui" font-size="19">F03.2  A person in a workflow is not automatically the person allowed to accept its consequence.</text></svg>
