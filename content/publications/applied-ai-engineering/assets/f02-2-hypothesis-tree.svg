<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Hypothesis tree</title><desc id="d">Five assumption branches connect a task hypothesis to evidence and stop paths.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="70" y="75" font-family="system-ui" font-size="38" font-weight="700">Choose uncertainty before mechanism</text><rect x="390" y="120" width="420" height="90" rx="20" fill="#343d78"/><text x="600" y="176" fill="#fff" text-anchor="middle" font-family="system-ui" font-size="25" font-weight="700">TASK HYPOTHESIS</text><g fill="none" stroke="#171717" stroke-width="3"><path d="M600 210V285M140 285H1060M140 285V340M370 285V340M600 285V340M830 285V340M1060 285V340"/></g><g font-family="system-ui" text-anchor="middle"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="40" y="340" width="200" height="100" rx="18"/><rect x="270" y="340" width="200" height="100" rx="18"/><rect x="500" y="340" width="200" height="100" rx="18"/><rect x="730" y="340" width="200" height="100" rx="18"/><rect x="960" y="340" width="200" height="100" rx="18"/></g><g font-size="21" font-weight="700"><text x="140" y="398">USER VALUE</text><text x="370" y="388">PRODUCT</text><text x="370" y="415">BEHAVIOR</text><text x="600" y="398">ADOPTION</text><text x="830" y="398">OPERATIONS</text><text x="1060" y="398">BUSINESS</text></g><text x="600" y="525" font-size="22">For each branch: evidence, owner, disconfirmation, next decision</text><rect x="240" y="565" width="720" height="80" rx="40" fill="#d7dbef" stroke="#343d78" stroke-width="3"/><text x="600" y="615" font-size="24" font-weight="700">CONTINUE  /  NARROW  /  STOP</text></g><text x="70" y="720" fill="#545454" font-family="system-ui" font-size="19">F02.2  Evidence targets the assumption most likely to overturn the project.</text></svg>
