<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Mechanism decision ladder</title><desc id="d">Seven mechanism options are compared against contract gaps without implying a maturity sequence.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="60" y="70" font-family="system-ui" font-size="38" font-weight="700">Escalate complexity only for a contract gap</text><g font-family="system-ui" text-anchor="middle"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="55" y="140" width="250" height="90" rx="18"/><rect x="345" y="140" width="250" height="90" rx="18"/><rect x="635" y="140" width="250" height="90" rx="18"/><rect x="925" y="140" width="220" height="90" rx="18"/><rect x="200" y="330" width="250" height="90" rx="18"/><rect x="490" y="330" width="250" height="90" rx="18"/><rect x="780" y="330" width="250" height="90" rx="18"/></g><g font-size="20" font-weight="700"><text x="180" y="195">RULES + FILTERS</text><text x="470" y="185">LEXICAL +</text><text x="470" y="210">STRUCTURED</text><text x="760" y="185">PREDICTIVE</text><text x="760" y="210">SCORING</text><text x="1035" y="185">MULTIMODAL</text><text x="1035" y="210">RETRIEVAL</text><text x="325" y="385">RANKING</text><text x="615" y="385">GENERATION</text><text x="905" y="375">TOOLS /</text><text x="905" y="400">AGENTS</text></g><path d="M180 230V275H1035V230M325 330V275M615 330V275M905 330V275" fill="none" stroke="#171717" stroke-width="3"/></g><rect x="155" y="515" width="890" height="100" rx="22" fill="#343d78"/><text x="600" y="557" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="23" font-weight="700">For every added mechanism: task value + evidence</text><text x="600" y="590" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="21">must exceed data, consequence, operating, and change burden.</text><text x="60" y="710" fill="#545454" font-family="system-ui" font-size="19">F04.1  Options form a decision set, not a maturity ladder.</text></svg>
