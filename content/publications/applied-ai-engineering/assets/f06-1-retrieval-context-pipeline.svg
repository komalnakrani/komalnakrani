<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Retrieval and context pipeline</title><desc id="d">A staged pipeline separates transformation, retrieval, eligibility, ranking, context, downstream use, and trace.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="50" y="70" font-family="system-ui" font-size="38" font-weight="700">Find the stage that changed the behavior</text><g font-family="system-ui" text-anchor="middle"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="40" y="145" width="180" height="90" rx="16"/><rect x="255" y="145" width="180" height="90" rx="16"/><rect x="470" y="145" width="180" height="90" rx="16"/><rect x="685" y="145" width="180" height="90" rx="16"/><rect x="900" y="145" width="250" height="90" rx="16"/><rect x="145" y="355" width="230" height="90" rx="16"/><rect x="485" y="355" width="230" height="90" rx="16"/><rect x="825" y="355" width="230" height="90" rx="16"/></g><g font-size="18" font-weight="700"><text x="130" y="190">QUERY</text><text x="130" y="214">TRANSFORM</text><text x="345" y="190">SOURCE /</text><text x="345" y="214">INDEX</text><text x="560" y="190">CANDIDATES</text><text x="775" y="180">PERMISSION +</text><text x="775" y="205">FRESHNESS</text><text x="1025" y="190">RANKING</text><text x="260" y="400">CONTEXT ASSEMBLY</text><text x="600" y="400">DOWNSTREAM USE</text><text x="940" y="400">USER EVIDENCE</text></g><path d="M220 190H255M435 190H470M650 190H685M865 190H900M1025 235V300H260V355M375 400H485M715 400H825" fill="none" stroke="#171717" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#171717"/></marker></defs><rect x="190" y="550" width="820" height="75" rx="37" fill="#343d78"/><text x="600" y="597" fill="#fff" font-size="21" font-weight="700">TRACE: versions + inclusion + exclusion + evidence state + fallback</text></g><text x="50" y="715" fill="#545454" font-family="system-ui" font-size="19">F06.1  Retrieval is one stage in an authorized context product.</text></svg>
