<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Applied AI evidence loop</title><desc id="d">Seven stages form a recursive loop with evidence returning to task and contract decisions.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="70" y="75" font-family="system-ui" font-size="38" font-weight="700">The applied AI evidence loop</text><g font-family="system-ui" font-size="20" text-anchor="middle"><path d="M600 155 C920 155 1040 310 970 470 C900 630 690 655 600 605 C510 655 300 630 230 470 C160 310 280 155 600 155" fill="none" stroke="#343d78" stroke-width="14"/><g fill="#fff" stroke="#171717" stroke-width="2"><rect x="500" y="115" width="200" height="70" rx="18"/><rect x="790" y="195" width="230" height="70" rx="18"/><rect x="865" y="380" width="230" height="70" rx="18"/><rect x="680" y="550" width="220" height="70" rx="18"/><rect x="300" y="550" width="220" height="70" rx="18"/><rect x="105" y="380" width="230" height="70" rx="18"/><rect x="180" y="195" width="230" height="70" rx="18"/></g><text x="600" y="158">Task</text><text x="905" y="238">Contract</text><text x="980" y="423">Mechanism + system</text><text x="790" y="593">Evaluation</text><text x="410" y="593">Release + operation</text><text x="220" y="423">Feedback</text><text x="295" y="238">Controlled change</text><text x="600" y="365" font-size="31" font-weight="700">EVIDENCE</text><text x="600" y="402" font-size="18">preserves why each decision remains justified</text></g><text x="70" y="720" fill="#545454" font-family="system-ui" font-size="19">F01.2  Stronger evidence may revise any earlier decision; the history remains inspectable.</text></svg>
