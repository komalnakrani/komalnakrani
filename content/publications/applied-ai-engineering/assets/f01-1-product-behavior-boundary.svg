<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Product behavior boundary</title><desc id="d">Four nested layers distinguish capability, component, product behavior, and authorized outcome.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="70" y="75" fill="#171717" font-family="system-ui" font-size="38" font-weight="700">From capability to accountable behavior</text><rect x="70" y="125" width="1060" height="540" rx="30" fill="#e9e1d4" stroke="#171717" stroke-width="3"/><text x="105" y="180" font-family="system-ui" font-size="25" font-weight="700">AUTHORIZED OUTCOME</text><text x="105" y="213" font-family="system-ui" font-size="18">Accepted by named product, domain, and risk authorities</text><rect x="175" y="245" width="850" height="350" rx="26" fill="#d7dbef" stroke="#343d78" stroke-width="3"/><text x="215" y="300" font-family="system-ui" font-size="25" font-weight="700">PRODUCT BEHAVIOR</text><text x="215" y="333" font-family="system-ui" font-size="18">Observable task behavior across data, software, controls, and people</text><rect x="295" y="375" width="610" height="155" rx="22" fill="#fff" stroke="#343d78" stroke-width="3"/><text x="335" y="430" font-family="system-ui" font-size="24" font-weight="700">MODEL COMPONENT</text><rect x="565" y="405" width="290" height="80" rx="40" fill="#343d78"/><text x="710" y="455" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="22" font-weight="700">CAPABILITY</text><text x="70" y="720" fill="#545454" font-family="system-ui" font-size="19">F01.1  The engineer owns technical behavior evidence, not every institutional decision.</text></svg>
