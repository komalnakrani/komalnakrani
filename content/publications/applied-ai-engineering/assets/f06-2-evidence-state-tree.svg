<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Evidence state decision tree</title><desc id="d">Evidence routes to respond, clarify, abstain, degrade, exclude, or prohibit according to permission, freshness, sufficiency, conflict, and scope.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="55" y="70" font-family="system-ui" font-size="38" font-weight="700">Evidence state dominates retrieval score</text><rect x="430" y="115" width="340" height="75" rx="20" fill="#343d78"/><text x="600" y="162" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="23" font-weight="700">RETRIEVED EVIDENCE</text><g fill="none" stroke="#171717" stroke-width="3"><path d="M600 190V260M110 260H1090M110 260V330M306 260V330M502 260V330M698 260V330M894 260V330M1090 260V330"/></g><g font-family="system-ui" text-anchor="middle" font-size="18" font-weight="700"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="25" y="330" width="170" height="105" rx="17"/><rect x="221" y="330" width="170" height="105" rx="17"/><rect x="417" y="330" width="170" height="105" rx="17"/><rect x="613" y="330" width="170" height="105" rx="17"/><rect x="809" y="330" width="170" height="105" rx="17"/><rect x="1005" y="330" width="170" height="105" rx="17" fill="#f1d2cf" stroke="#8b2f2f"/></g><text x="110" y="375">FRESH +</text><text x="110" y="400">SUFFICIENT</text><text x="306" y="375">INCOMPLETE</text><text x="306" y="400">CLARIFY</text><text x="502" y="375">CONFLICT</text><text x="502" y="400">ABSTAIN</text><text x="698" y="375">STALE</text><text x="698" y="400">DEGRADE</text><text x="894" y="375">UNAUTHORIZED</text><text x="894" y="400">EXCLUDE</text><text x="1090" y="375">PROHIBITED</text><text x="1090" y="400">STOP</text><rect x="190" y="555" width="820" height="75" rx="37" fill="#343d78"/><text x="600" y="602" fill="#fff" font-size="21">ABSENT: correct / ordinary search / abstain - never invent</text></g><text x="55" y="715" fill="#545454" font-family="system-ui" font-size="19">F06.2  Permission and evidence sufficiency precede presentation.</text></svg>
