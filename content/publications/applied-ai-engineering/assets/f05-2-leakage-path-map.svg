<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Leakage path map</title><desc id="d">Development, tuning, evaluator development, challenge, and sealed release partitions show allowed flows and prohibited contamination paths.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="60" y="70" font-family="system-ui" font-size="38" font-weight="700">Held out means answers cannot travel backward</text><g font-family="system-ui" text-anchor="middle"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="50" y="160" width="200" height="100" rx="18"/><rect x="285" y="160" width="200" height="100" rx="18"/><rect x="520" y="160" width="200" height="100" rx="18"/><rect x="755" y="160" width="200" height="100" rx="18"/><rect x="990" y="145" width="170" height="130" rx="18" fill="#d7dbef"/></g><g font-size="19" font-weight="700"><text x="150" y="220">DEVELOPMENT</text><text x="385" y="220">TUNING</text><text x="620" y="205">EVALUATOR</text><text x="620" y="232">DEVELOPMENT</text><text x="855" y="220">CHALLENGE</text><text x="1075" y="195">FROZEN</text><text x="1075" y="222">RELEASE</text><text x="1075" y="249">EVALUATION</text></g><path d="M250 210H285M485 210H520M720 210H755M955 210H990" fill="none" stroke="#171717" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#171717"/></marker></defs><g stroke="#8b2f2f" stroke-width="5"><path d="M1075 300C1075 500 385 500 385 285" fill="none" stroke-dasharray="12 9"/><path d="M1075 330C1075 570 620 570 620 285" fill="none" stroke-dasharray="12 9"/></g><text x="730" y="480" fill="#8b2f2f" font-size="21" font-weight="700">PROHIBITED: duplicate, label, feature, time, reviewer, or answer leakage</text><rect x="195" y="590" width="810" height="70" rx="35" fill="#343d78"/><text x="600" y="635" fill="#fff" font-size="21" font-weight="700">After a release case drives a fix, it becomes development knowledge.</text></g><text x="60" y="715" fill="#545454" font-family="system-ui" font-size="19">F05.2  Partition identity is a process and lineage claim, not a filename.</text></svg>
