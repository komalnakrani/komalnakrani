<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Task anatomy</title><desc id="d">A flow from actor and trigger through context, action, baseline, consequence, affected groups, and evidence.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="70" y="75" font-family="system-ui" font-size="38" font-weight="700">Anatomy of a falsifiable task</text><g font-family="system-ui"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="70" y="145" width="220" height="100" rx="18"/><rect x="350" y="145" width="220" height="100" rx="18"/><rect x="630" y="145" width="220" height="100" rx="18"/><rect x="910" y="145" width="220" height="100" rx="18"/><rect x="70" y="360" width="220" height="100" rx="18"/><rect x="350" y="360" width="220" height="100" rx="18"/><rect x="630" y="360" width="220" height="100" rx="18"/><rect x="910" y="360" width="220" height="100" rx="18"/></g><g font-size="22" font-weight="700" text-anchor="middle"><text x="180" y="205">ACTOR</text><text x="460" y="205">TRIGGER</text><text x="740" y="205">CONTEXT</text><text x="1020" y="205">DECISION / ACTION</text><text x="180" y="420">BASELINE</text><text x="460" y="420">FRICTION</text><text x="740" y="410">CONSEQUENCE +</text><text x="740" y="437">AFFECTED GROUPS</text><text x="1020" y="420">EVIDENCE</text></g><path d="M290 195H350M570 195H630M850 195H910M1020 245V320H180V360M290 410H350M570 410H630M850 410H910" fill="none" stroke="#171717" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#171717"/></marker></defs><rect x="210" y="550" width="780" height="85" rx="42" fill="#343d78"/><text x="600" y="602" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Mechanism remains undecided until this chain is credible.</text></g><text x="70" y="720" fill="#545454" font-family="system-ui" font-size="19">F02.1  A named task can be disproved; “add AI” cannot.</text></svg>
