<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Behavior state model</title><desc id="d">Evidence routes a request to response, clarification, abstention, escalation, degraded, or prohibited states.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="70" y="75" font-family="system-ui" font-size="38" font-weight="700">Uncertainty is a state, not an apology</text><rect x="430" y="120" width="340" height="80" rx="20" fill="#343d78"/><text x="600" y="170" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="24" font-weight="700">REQUEST + EVIDENCE</text><g fill="none" stroke="#171717" stroke-width="3"><path d="M600 200V285M115 285H1085M115 285V350M309 285V350M503 285V350M697 285V350M891 285V350M1085 285V350"/></g><g font-family="system-ui" text-anchor="middle" font-size="19" font-weight="700"><g fill="#fff" stroke="#343d78" stroke-width="3"><rect x="30" y="350" width="170" height="100" rx="18"/><rect x="224" y="350" width="170" height="100" rx="18"/><rect x="418" y="350" width="170" height="100" rx="18"/><rect x="612" y="350" width="170" height="100" rx="18"/><rect x="806" y="350" width="170" height="100" rx="18"/><rect x="1000" y="350" width="170" height="100" rx="18" fill="#f1d2cf" stroke="#8b2f2f"/></g><text x="115" y="407">RESPOND</text><text x="309" y="407">CLARIFY</text><text x="503" y="407">ABSTAIN</text><text x="697" y="407">ESCALATE</text><text x="891" y="397">DEGRADED</text><text x="891" y="422">MODE</text><text x="1085" y="407">PROHIBITED</text><rect x="255" y="545" width="690" height="85" rx="42" fill="#d7dbef" stroke="#343d78" stroke-width="3"/><text x="600" y="596" font-size="23">Every state names evidence and a next action.</text></g><text x="70" y="720" fill="#545454" font-family="system-ui" font-size="19">F03.1  A complete contract specifies what happens when the ordinary response is not justified.</text></svg>
