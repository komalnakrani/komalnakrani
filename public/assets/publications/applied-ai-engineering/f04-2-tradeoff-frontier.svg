<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Mechanism tradeoff frontier</title><desc id="d">Four portfolios occupy different positions across product quality and total burden.</desc><rect width="1200" height="760" fill="#f7f4ee"/><text x="60" y="70" font-family="system-ui" font-size="38" font-weight="700">Product value has more than one axis</text><g font-family="system-ui"><line x1="130" y1="610" x2="1080" y2="610" stroke="#171717" stroke-width="4"/><line x1="130" y1="610" x2="130" y2="130" stroke="#171717" stroke-width="4"/><text x="610" y="680" text-anchor="middle" font-size="22">Total data, latency, cost, risk, operating, and change burden</text><text x="44" y="375" transform="rotate(-90 44 375)" text-anchor="middle" font-size="22">Contracted task behavior</text><path d="M190 550 C330 390 470 410 560 300 C665 175 820 225 1040 150" fill="none" stroke="#343d78" stroke-width="7" stroke-dasharray="12 10"/><g stroke="#171717" stroke-width="3"><circle cx="250" cy="475" r="30" fill="#e9e1d4"/><circle cx="480" cy="365" r="30" fill="#d7dbef"/><circle cx="690" cy="260" r="30" fill="#343d78"/><circle cx="930" cy="235" r="30" fill="#f1d2cf"/></g><g font-size="19" font-weight="700"><text x="205" y="430">BASELINE</text><text x="420" y="320">MULTIMODAL</text><text x="645" y="210">HYBRID</text><text x="870" y="190">GENERATION</text></g></g><text x="60" y="725" fill="#545454" font-family="system-ui" font-size="19">F04.2  The acceptable point depends on this task and its operating context.</text></svg>
