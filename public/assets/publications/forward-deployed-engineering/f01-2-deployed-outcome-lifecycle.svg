  <title id="title">F01.2 — The deployed-outcome lifecycle</title><desc id="desc">Circular lifecycle from discovery and outcome contract through build, verification, launch, stabilization, ownership, and product learning, with evidence returning to earlier decisions. Reading order: Discover: Workflow evidence; Contract: Outcome · guardrails; Scope: Safe vertical path; Build: Production slice; Verify: Decision evidence; Release: Controlled exposure; Stabilize: Restore · correct; Own: Customer capability; Learn: Bounded reuse.</desc>
