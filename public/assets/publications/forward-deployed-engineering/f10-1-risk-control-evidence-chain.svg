  <rect width="1200" height="760" fill="#FFFFFF"/><path d="M0 132 H1200 M0 690 H1200" stroke="#D1D1D1"/>
  <text x="60" y="58" class="mono" font-size="13" letter-spacing="2" fill="#2C4A6E">F10.1 · FORWARD DEPLOYED ENGINEERING</text>
  <text x="60" y="103" text-anchor="start" font-size="30" font-weight="700" fill="#121212" class=""><tspan x="60" dy="0">Control claims require executed evidence</tspan></text>
