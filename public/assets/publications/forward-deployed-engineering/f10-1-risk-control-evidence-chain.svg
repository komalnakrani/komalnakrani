<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F10.1 — Control claims require executed evidence</title><desc id="desc">Chain from asset and threat through contextual risk, control objective, implementation, verification, versioned evidence, operating owner, and designated approval or exception, with failed verification returning to discovery. Reading order: Context: Asset · obligation · threat; Risk statement: Condition + consequence; Control objective: Required property; Implementation: Actual mechanism; Verification: Executed result; Decision: Owner · approve · exception.</desc>
