  <title id="title">F15.1 — Readiness is an evidence decision</title><desc id="desc">Readiness gate where outcome, scope, design, implementation, verification, operations, recovery, ownership, and risk evidence receive met, gap, exception, reduced-scope, or block dispositions. Reading order: Evidence packet: Outcome · design · build; Proof packet: Verification · operations; Ownership packet: Recovery · support · risk; Disposition: Met · gap · accepted exception; Authority: Named decision owner; Decision: Go · conditional · reduce · delay · stop.</desc>
