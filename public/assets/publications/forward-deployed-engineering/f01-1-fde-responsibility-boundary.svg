<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F01.1 — The FDE responsibility boundary</title><desc id="desc">Boundary map placing the FDE between customer workflow, production engineering, and product learning, with formal authorities outside the shared delivery area. Reading order: Customer workflow: Observed work: Adoption evidence; Production engineering: Reliable system: Recovery evidence; Product learning: Reusable pattern: Disconfirmation; Formal authority: Security · privacy · safety: Named approvers; Adjacent roles: Product · account · strategy: Shared, not absorbed.</desc>
