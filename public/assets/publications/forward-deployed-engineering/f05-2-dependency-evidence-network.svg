  <title id="title">F05.2 — Dependencies are decision gates</title><desc id="desc">Dependency network linking ticketing, equipment registry, manuals, inventory, identity, network, approvals, support, and pilot users to vertical milestones and a critical uncertainty path. Reading order: Customer systems: Ticketing · registry: Inventory · manuals; Operating boundary: Identity · network · region: Support · pilot users; Authority gates: Safety · security · privacy: Owner evidence; Vertical milestones: Contract · slice · verification: Release decision; Critical uncertainty: Equipment binding: Unknown-write reconciliation.</desc>
