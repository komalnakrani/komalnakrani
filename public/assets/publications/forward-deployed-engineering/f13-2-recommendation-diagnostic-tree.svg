  <title id="title">F13.2 — Diagnose from symptom to boundary</title><desc id="desc">Diagnostic tree for a slow or untrusted recommendation, branching from user symptom and cohort through dependency, connectivity, equipment binding, evidence freshness, model bundle, policy, authorization, UI, support, containment and owner action. Reading order: Symptom + cohort: Slow · absent · untrusted; Service path: Dependency · network · fallback; Evidence path: Equipment · provenance · freshness; Decision path: Model bundle · policy · approval; Workflow path: UI · task · support; Contain + own: Safe state · next evidence · owner.</desc>
