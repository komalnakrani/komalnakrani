<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">F15.2 — Rollout patterns buy different evidence</title><desc id="desc">Comparison of internal, shadow, canary, cohort, regional, and full rollout across user effect, evidence, comparability, representativeness, blast radius, reversibility, duration, support and recovery. Reading order: Internal: Low user effect: Weak representativeness; Shadow: Comparable outputs: No direct action; Canary: Small live exposure: Fast stop; Cohort: Defined population: Representative task; Regional: Boundary evidence: Higher coordination; Full: Broad effect: Highest proof and recovery burden.</desc>
